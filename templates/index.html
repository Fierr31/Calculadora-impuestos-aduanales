<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X_UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../static/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-slate-100 min-h-screen text-slate-800">

    <header class="bg-slate-200 shadow-sm">
      <nav class="max-w-5xl mx-auto flex items-center justify-between px-6 py-4">
        <a class="brand flex items-center gap-2" href="" title="Calculadora de impuestos aduanales">
            <img src="" alt="logo" class="h-8 w-auto">
        </a>
        <div class="tittle text-2xl font-bold text-slate-700">
          Calculadora de impuestos aduanales
        </div>
      </nav>
    </header>

    <div class="main max-w-5xl mx-auto px-6 py-10 space-y-8">

      <!-- CARD ENTRADAS -->
      <div class="entradas bg-white rounded-2xl shadow-md p-8 space-y-6">

        <h2 class="text-xl font-semibold text-slate-700">
          Datos de entrada
        </h2>

        <div class="autocomplete-container relative">
          <input 
              type="text" 
              id="productoInput"
              placeholder="Escribe el producto"
              autocomplete="off"
              class="w-full rounded-lg border border-slate-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition"
          >
          <ul id="sugerencias" 
              class="absolute z-10 w-full bg-white border border-slate-200 rounded-lg mt-1 shadow-md max-h-48 overflow-y-auto">
          </ul>
        </div>

        <div class="grid md:grid-cols-2 gap-6">

          <div class="subtotal flex flex-col gap-1">
            <label for="precio" class="text-sm font-medium text-slate-600">
              Precio Unitario
            </label>
            <input 
              type="number" 
              min="0.01" 
              step="0.01" 
              id="preciounit" 
              placeholder="Ingresa el precio unitario"
              class="rounded-lg border border-slate-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition"
            />
          </div>

          <div class="subtotal flex flex-col gap-1">
            <label for="cantidad" class="text-sm font-medium text-slate-600">
              Cantidad
            </label>
            <input 
              type="number" 
              min="1" 
              step="1" 
              id="cantidad" 
              placeholder="Ingresa la cantidad"
              class="rounded-lg border border-slate-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition"
            />
          </div>

          <div class="subtotal flex flex-col gap-1">
            <label for="pais" class="text-sm font-medium text-slate-600">
              País de orígen
            </label>
            <input 
              type="text" 
              id="pais" 
              placeholder="Ingresa el pais"
              class="rounded-lg border border-slate-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition"
            />
          </div>

          <div class="subtotal flex flex-col gap-1">
            <label for="flete" class="text-sm font-medium text-slate-600">
              Monto del flete
            </label>
            <input 
              type="number" 
              min="0.01" 
              step="0.01" 
              id="flete" 
              placeholder="Ingresa el monto del flete"
              class="rounded-lg border border-slate-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition"
            />
          </div>

          <div class="subtotal flex flex-col gap-1 md:col-span-2">
            <label for="seguro" class="text-sm font-medium text-slate-600">
              Monto del seguro
            </label>
            <input 
              type="number" 
              min="0.01" 
              step="0.01" 
              id="seguro" 
              placeholder="Ingresa el monto del seguro"
              class="rounded-lg border border-slate-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 transition"
            />
          </div>

        </div>

        <button 
          id="calcularBtn"
          class="w-full bg-yellow-400 hover:bg-yellow-500 active:scale-[0.98] transition transform rounded-xl py-3 text-lg font-semibold text-slate-800 shadow-md"
        >
          Calcular
        </button>

      </div>
      
      <!-- CARD ESPECIFICACIONES -->
      <section 
        id="resultado"
        class="bg-white rounded-2xl shadow-md p-8 space-y-4"
      >
          <h3 class="text-xl font-semibold text-slate-700">
            Especificaciones del producto
          </h3>
          <div 
            id="resultadoContenido"
            class="text-slate-700 space-y-2 text-sm"
          ></div>
      </section>

      <!-- CARD DESGLOSE -->
      <div 
        id="baseg" 
        style="display:none;"
        class="bg-white rounded-2xl shadow-md p-8 space-y-3"
      >
        <h3 class="text-xl font-semibold text-slate-700 mb-4">
          Desglose del cálculo
        </h3>

        <p class="flex justify-between border-b pb-2">
          <span>Valor en aduana:</span>
          <span class="font-medium">$<span id="va"></span></span>
        </p>

        <p class="flex justify-between border-b pb-2">
          <span>IGI:</span>
          <span class="font-medium">$<span id="igi"></span></span>
        </p>

        <p class="flex justify-between border-b pb-2">
          <span>DTA:</span>
          <span class="font-medium">$<span id="dta"></span></span>
        </p>

        <p class="flex justify-between border-b pb-2">
          <span>Base gravable:</span>
          <span class="font-medium">$<span id="base"></span></span>
        </p>

        <p class="flex justify-between border-b pb-2">
          <span>IEPS:</span>
          <span class="font-medium">$<span id="ieps"></span></span>
        </p>

        <p class="flex justify-between border-b pb-2 text-lg font-semibold">
          <span>Total (con IVA):</span>
          <span>$<span id="total"></span></span>
        </p>

        <p class="flex justify-between text-slate-600">
          <span>IVA:</span>
          <span>$<span id="iva"></span></span>
        </p>
      </div>

    </div>

    <script src="../static/script.js"></script>
  </body>
</html>
